services:
  postgres:
    image: postgres:16
    container_name: pulse-pg
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    # wal_level=logical so the M2 CDC consumer can use logical replication.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=8"
      - "-c"
      - "max_wal_senders=8"
    ports:
      - "54329:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pulse_pgdata:
