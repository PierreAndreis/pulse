name: Publish (npm)

# Tag-driven: pushing v0.1.0 publishes every @onveloz/pulse-* package to npm.
# The ONLY required setup is the NPM_TOKEN secret (an npm automation token with
# publish rights to the @onveloz scope). Everything else is automated.
on:
  push:
    tags: ["v*"]

# Default to read-only; the job opts into exactly what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    # Required-reviewer gate: configure Settings → Environments → production with
    # required reviewers, so a tag push cannot publish without a human approval.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC, enables npm provenance attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Build every package's dist (prepack also does this, but build first so a
      # failure stops us before any publish).
      - name: Build packages
        run: pnpm -r --filter='./packages/*' run build

      # Defense-in-depth: refuse to publish if any non-private package version
      # disagrees with the tag (the engine downloads binaries from the matching
      # release tag, so a mismatch would ship a broken install).
      - name: Assert package versions match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for p in packages/*/package.json; do
            priv=$(node -p "require('./$p').private === true")
            [ "$priv" = "true" ] && continue
            v=$(node -p "require('./$p').version")
            [ "$v" = "$TAG" ] || { echo "::error::$p is $v but tag is v$TAG"; exit 1; }
          done

      # Publish all non-private packages. pnpm rewrites workspace:* to the real
      # versions and applies each package's publishConfig. --no-git-checks is
      # load-bearing for the detached-HEAD tag checkout; tag protection + the
      # production environment gate are the real safeguards. --provenance emits a
      # signed attestation tying each package to this repo+workflow run.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
