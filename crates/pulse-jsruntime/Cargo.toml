[package]
name = "pulse-jsruntime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TS query/mutation execution. M1: Node/Bun worker driver. Later: embedded V8 (deno_core)."

[dependencies]
pulse-core = { workspace = true }
pulse-sql = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
pulse-sql = { workspace = true }
pulse-core = { workspace = true }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

# Test-only stub that speaks the worker NDJSON protocol, so the integration tests
# can drive the real `Worker` without a Node/Bun runtime.
[[bin]]
name = "stub_worker"
path = "tests/support/stub_worker.rs"
